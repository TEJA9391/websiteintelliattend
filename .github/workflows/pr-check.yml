name: PR Check — Cosmetic Only

on:
  pull_request:
    branches: [main, master]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for protected file changes
        run: |
          PROTECTED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(lib/Core/|lib/Data/|lib/Services/|lib/engine/|lib/main\.dart)' || true)
          if [ -n "$PROTECTED_FILES" ]; then
            echo "ERROR: You modified protected files:"
            echo "$PROTECTED_FILES"
            echo ""
            echo "You can ONLY edit files in:"
            echo "  - lib/presentation/"
            echo "  - lib/Theme/"
            echo "  - assets/"
            exit 1
          fi
          echo "All changes are in allowed directories."

name: CI

on:
  push:
    # `main` is a stale branch in this repository (it predates school-dev
    # and is not the default branch). `school-dev` was missing entirely,
    # which meant PRs into the integration branch ran no CI at all.
    branches: [school-dev, school-main]
  pull_request:
    branches: [school-dev, school-main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Upload the PUBLISHABLE output. The previous step uploaded `.next`,
      # which is Next.js's intermediate build cache — but the Cloudflare
      # deploy publishes `out/` (next.config.ts sets `output: "export"`).
      # The artifact therefore did not contain the thing that actually gets
      # deployed, and could not be used to reproduce a deploy.
      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.event_name }}-${{ github.ref_name }}-${{ github.run_number }}
          path: out
          retention-days: 1
          if-no-files-found: warn

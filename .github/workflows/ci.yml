# ─────────────────────────────────────────────────────────────────────────────
# IntelliAttend-Web — local, self-contained CI (traditional setup).
#
# Every job lives in this file. No org-level reusable workflows: the previous
# `uses: IntelliAttend/.github/...@ci-v1|cd-v1` calls (IA-1, Oct 21) pointed at
# IntelliAttend/.github, which disappeared on Oct 22 — the wrapper kept a green
# file while the pipeline behind it 404'd. A pipeline that can vanish without a
# commit here is not a pipeline. Same rationale as AdminPanel's ci.yml.
#
# Jobs:
#   1. lint              — npm run lint (eslint)
#   2. type-check        — npx tsc --noEmit (package.json `typecheck` script)
#   3. build             — npm run build (next build; also the canary for
#                          deploy.yml, which rebuilds from source)
#   4. integration-guard — school-dev is PR-only (rejects direct pushes)
#   5. backport          — school-main → school-dev reconciliation after a
#                          production push (hotfix path)
#
# Web has NO test suite yet (audit F-08) — a Test job would be dishonest, so
# one is omitted rather than emitted as an empty green check. Flip it on when
# the first suite lands.
#
# deploy.yml is untouched: it already carries its own guard → ci → deploy
# chain (staging on school-dev, production on school-main).
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [school-main, school-dev]
  pull_request:
    branches: [school-main, school-dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

  build:
    name: Build
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (next build)
        run: npm run build

  # L1 enforcement — the integration branch is PR-only.
  #
  # The deploy guard (deploy.yml) protects production; this protects the gate
  # TO production. It runs on push so a violating push turns CI red on
  # school-dev itself, where the author sees it. A commit is legitimate when a
  # MERGED pull request contains it — merge, squash and rebase merges alike —
  # and a direct push has no associated merged PR. Fails CLOSED if the API is
  # unreachable.
  integration-guard:
    name: Guard — school-dev is PR-only
    if: github.event_name == 'push' && github.ref_name == 'school-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Reject direct pushes to school-dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          MERGED="$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length' || echo 0)"
          if [ "$MERGED" -gt 0 ]; then
            echo "Push discipline OK: commit is in a merged pull request."
            exit 0
          fi
          echo "::error::Direct push to school-dev rejected."
          echo "::error::Commit: $(git log -1 --pretty=%s "$SHA" 2>/dev/null || echo '(fetch failed)')"
          echo "::error::Open a PR: feature/* -> school-dev -> school-main."
          exit 1

  # Port-back discipline — production hotfixes must return to school-dev.
  #
  # Content, not ancestry, decides: a normal promotion adds a merge commit to
  # school-main whose tree is identical to school-dev's, so the job exits as a
  # no-op. Only a genuine hotfix push to school-main (single-parent, (#hotfix))
  # changes production content without school-dev — then this opens the
  # reconciliation PR so the fix is never stranded in production.
  backport:
    name: Backport — reconcile school-main into school-dev
    if: github.event_name == 'push' && github.ref_name == 'school-main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open reconciliation PR if school-main has content school-dev lacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --quiet origin school-dev

          if git diff --quiet origin/school-dev origin/school-main; then
            echo "school-main and school-dev trees are identical; nothing to backport."
            exit 0
          fi

          BRANCH="backport/school-main-into-school-dev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/school-main
          git merge origin/school-dev --no-edit \
            -m "chore: reconcile school-main into school-dev (automated backport)"
          git push --quiet origin "$BRANCH" --force

          OPEN="$(gh pr list --repo "${{ github.repository }}" \
            --head "$BRANCH" --base school-dev --state open --json number --jq 'length')"
          if [ "$OPEN" -gt 0 ]; then
            echo "Reconciliation PR already open."
            exit 0
          fi

          PR_URL="https://github.com/${{ github.repository }}/compare/school-dev...$BRANCH?expand=1"
          if gh pr create --repo "${{ github.repository }}" \
            --base school-dev --head "$BRANCH" \
            --title "Backport: reconcile school-main into school-dev" \
            --body "Automated port-back after a school-main push (hotfix path). Review and merge so school-dev contains everything running in production."; then
            echo "Reconciliation PR opened."
            exit 0
          fi

          echo "::warning::Could not auto-create the reconciliation PR (Actions PR creation likely disabled in repo settings). Branch pushed; create it manually: $PR_URL"
          {
            echo "### Backport needed — manual step required"
            echo "school-main has content school-dev lacks. The reconciliation branch was pushed."
            echo ""
            echo "[Create the reconciliation PR]($PR_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

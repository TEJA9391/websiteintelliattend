# ─────────────────────────────────────────────────────────────────────────────
# IntelliAttend-Web — Tier-2 wrapper (governs .github/workflows/ci.yml)
# Target refs: school-dev (integration/staging) + school-main (production)
#
# Replaces the audited state: CI on `main` only, no guard, no school-dev.
# The one-time ref reconciliation is done (school-dev created from school-main,
# default branch switched) — see devops-reform/CHANGE_LOG.md §1.4/§1.5.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [school-main, school-dev]
  pull_request:
    branches: [school-main, school-dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: IntelliAttend/.github/.github/workflows/ci-node-web.yml@ci-v1
    with:
      working-directory: '.'
      node-version: '20'
      # Web has NO test suite (audit F-08). `has-tests: false` is honest:
      # it omits the Test check entirely rather than emitting a check that
      # prints "no test runner selected" and goes green. Flip to true and
      # set `javascript: 'vitest'` when the first suite lands.
      has-tests: false
      has-build: true
      prepare-env: false
    secrets: inherit
    permissions:
      contents: read

  # L1 enforcement — the integration branch is PR-only.
  #
  # The push guard protects production; this protects the gate TO production.
  # A direct push to school-dev would otherwise land unreviewed code that the
  # promotion PR then carries into production. It runs inside CI so a
  # violating push turns CI red on school-dev itself, where the author sees it.
  integration-guard:
    if: github.event_name == 'push' && github.ref_name == 'school-dev'
    uses: IntelliAttend/.github/.github/workflows/guard-integration.yml@cd-v1
    with:
      integration-branch: 'school-dev'
    secrets: inherit
    permissions:
      contents: read

  # Production drift reconciler — if a (#hotfix) push lands on school-main,
  # this opens the school-main → school-dev PR so the fix is never prod-only.
  backport:
    if: github.event_name == 'push' && github.ref_name == 'school-main'
    needs: [ci]
    uses: IntelliAttend/.github/.github/workflows/promote-backport.yml@cd-v1
    with:
      production-branch: 'school-main'
      integration-branch: 'school-dev'
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

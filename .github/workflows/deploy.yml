name: Deploy to Cloudflare Pages

on:
  push:
    branches: [school-main, school-dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Branch protection is unavailable (GitHub free plan; branch protection and
  # rulesets are paid features for private repos), so this guard is the only
  # server-side control on school-main.
  guard:
    name: Guard — PR discipline check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'school-main'
    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry checks against school-dev need full history.
          fetch-depth: 0

      - name: Verify school-main push discipline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event.forced }}" = "true" ]; then
            echo "::error::Force pushes to school-main are not allowed. Use a pull request."
            exit 1
          fi

          SHA="${{ github.sha }}"
          SUBJECT="$(git log -1 --pretty=%s "$SHA")"

          PARENT_COUNT=$(git rev-list --parents -n 1 "$SHA" | wc -w | tr -d ' ')
          PARENT_COUNT=$((PARENT_COUNT - 1))

          # This repository NOW HAS a school-dev branch (it was created from
          # school-main as part of the org-wide DevOps reform). The previous
          # version of this guard asserted the opposite — "this one has NO
          # school-dev branch — pull requests target school-main directly" —
          # and consequently accepted ANY merge commit, without checking that
          # it actually contained the integration branch. That was the
          # weaker "merge-commit only" rule used by the SmartBoard and
          # Student workflows, both of which had the same stale comment and
          # the same under-enforcement.
          #
          # The ancestry check below is the strongest variant in the org (the
          # same one Server, AdminPanel and Faculty use): the production
          # commit must be a merge commit that CONTAINS school-dev.
          git fetch --quiet origin school-dev || true
          BASE="origin/school-dev"

          if [ "$PARENT_COUNT" -ge 2 ] && git rev-parse --verify --quiet "$BASE" >/dev/null; then
            if git merge-base --is-ancestor "$BASE" "$SHA"; then
              echo "Push discipline OK: merge containing school-dev ($BASE)."
              exit 0
            fi
            echo "::warning::Merge commit does not contain $BASE; checking hotfix rule."
          fi

          # Documented emergency hotfix: marker must be in the SUBJECT.
          if [ "$PARENT_COUNT" -eq 1 ] && [[ "$SUBJECT" == *"(#hotfix)"* ]]; then
            echo "::notice::Hotfix path used (direct commit to school-main)."
            exit 0
          fi

          echo "::error::Direct push to school-main rejected."
          echo "::error::Commit: $SUBJECT"
          echo "::error::Parents: $PARENT_COUNT"
          echo "::error::Open a pull request: feature/IA-* → school-dev → school-main."
          exit 1

  # ── STAGING: automatic on every push to school-dev ──
  staging:
    name: Deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest
    needs: [ci]
    # Staging only, and only after CI is green.
    if: always() && !cancelled() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref_name == 'school-dev'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight — required secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${CLOUDFLARE_API_TOKEN}" ]  && MISSING="${MISSING} CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && MISSING="${MISSING} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository secret(s):${MISSING}"
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Deploy to Cloudflare Pages (staging branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.86.0 pages deploy out \
            --project-name=intelliattend-web \
            --branch=dev \
            --commit-dirty=true

  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    needs: [guard]
    # `always()` keeps workflow_dispatch working (guard is skipped there) while
    # a failed guard still blocks the build.
    if: always() && !failure() && !cancelled()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Cloudflare Pages (production)
    runs-on: ubuntu-latest
    needs: [ci, guard]
    # PRODUCTION ONLY. The `staging` job handles school-dev; without the ref
    # check a push to school-dev would also run the production deploy.
    #
    # The guard must have SUCCEEDED for a push, so a rejected push can never
    # reach production. It is allowed to be SKIPPED for a manual
    # `workflow_dispatch`, because the guard's own `if` only fires on a push
    # to school-main — that is the "re-deploy the current production build"
    # escape hatch, and it is kept working.
    if: >
      always() && !cancelled() && needs.ci.result == 'success' &&
      (needs.guard.result == 'success' || needs.guard.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'school-main')
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight — required secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${CLOUDFLARE_API_TOKEN}" ]  && MISSING="${MISSING} CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && MISSING="${MISSING} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository secret(s):${MISSING}"
            echo "::error::This repository has no Cloudflare credentials configured, so the"
            echo "::error::deploy cannot run. Create them with:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN  -R IntelliAttend/IntelliAttend-Web"
            echo "::error::  gh secret set CLOUDFLARE_ACCOUNT_ID -R IntelliAttend/IntelliAttend-Web"
            echo "::error::Token scope required: Account > Cloudflare Pages > Edit."
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # PINNED and non-interactive.
        #
        # The previous step used `cloudflare/wrangler-action@v3`, which
        # shells out to `npx wrangler@<version>` to install wrangler when it
        # is not present locally. On a hosted runner that npx call has no
        # `--yes`, so it aborts with:
        #
        #   npm error npx canceled due to missing packages and no YES option
        #
        # which failed every production deploy (18 of 18 runs, 100%).
        #
        # Calling the pinned version directly is deterministic, never
        # prompts, and does not depend on the action's install path.
        run: |
          set -euo pipefail
          npx --yes wrangler@4.86.0 pages deploy out \
            --project-name=intelliattend-web \
            --branch=school-main \
            --commit-dirty=true

      - name: Get deployment URL
        run: |
          echo "Deployment complete!"
          echo "Check Cloudflare Pages dashboard for the preview URL"
          echo "Production URL: https://www.intelliattend.com"

<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>IntelliAttend - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#1a211f",
                        "primary-fixed": "#71f8e4",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-container-lowest": "#090f0e",
                        "on-primary-fixed-variant": "#005048",
                        "tertiary": "#bec6e0",
                        "surface-bright": "#343b39",
                        "error-container": "#93000a",
                        "on-secondary-container": "#003111",
                        "inverse-on-surface": "#2b3230",
                        "surface-variant": "#2f3634",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "secondary-container": "#1ca64d",
                        "on-tertiary-container": "#323a4f",
                        "surface-container-highest": "#2f3634",
                        "on-surface-variant": "#bbcac6",
                        "on-secondary-fixed-variant": "#005320",
                        "secondary-fixed-dim": "#62df7d",
                        "primary-container": "#14b8a6",
                        "on-error": "#690005",
                        "tertiary-fixed": "#dae2fd",
                        "primary": "#4fdbc8",
                        "on-primary": "#003731",
                        "error": "#ffb4ab",
                        "surface-tint": "#4fdbc8",
                        "surface-container-high": "#252b2a",
                        "secondary": "#62df7d",
                        "on-tertiary": "#283044",
                        "on-secondary": "#003914",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#bec6e0",
                        "primary-fixed-dim": "#4fdbc8",
                        "on-surface": "#dde4e1",
                        "inverse-surface": "#dde4e1",
                        "secondary-fixed": "#7ffc97",
                        "inverse-primary": "#006b5f",
                        "surface-dim": "#0e1513",
                        "on-primary-fixed": "#00201c",
                        "background": "#000000",
                        "outline-variant": "#3c4947",
                        "outline": "#859490",
                        "on-primary-container": "#00423b",
                        "on-background": "#dde4e1",
                        "tertiary-container": "#9ca4bd",
                        "surface-container-low": "#161d1b",
                        "surface": "#121212",
                        "on-secondary-fixed": "#002109"
                    },
                    "fontFamily": {
                        "display": ["Inter", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        body { min-height: 100dvh; }
    </style>
</head>
<body class="bg-black font-display text-on-surface antialiased selection:bg-primary selection:text-on-primary">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <!-- Subtle background decoration -->
        <div class="absolute -right-32 top-0 size-96 rounded-full bg-primary/5 blur-[100px] pointer-events-none"></div>
        <div class="absolute -left-32 top-64 size-96 rounded-full bg-secondary/5 blur-[100px] pointer-events-none"></div>

        <!-- Header -->
        <header class="flex items-center justify-between p-6 z-10 border-b border-surface-container-highest">
            <div class="flex items-center gap-3">
                <div class="flex size-10 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-secondary shadow-lg">
                    <span class="material-symbols-outlined text-white text-xl" style="font-variation-settings: 'FILL' 1;">school</span>
                </div>
                <h2 class="text-white text-xl font-bold tracking-tight">IntelliAttend</h2>
            </div>
            <button class="flex size-10 items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-on-surface-variant">person</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col p-6 max-w-[760px] mx-auto w-full z-10 justify-center">
            <div class="mb-8 mt-4">
                <h1 class="text-3xl font-bold text-white tracking-tight">Welcome back!</h1>
                <p class="text-on-surface-variant mt-2">Here is your upcoming session for today.</p>
            </div>

            <!-- Subject Details Card -->
            <div class="relative overflow-hidden rounded-3xl bg-surface-variant/30 border border-outline-variant/30 backdrop-blur-md p-8 shadow-2xl transition-transform hover:scale-[1.01] duration-300">
                <div class="absolute right-0 top-0 p-6 opacity-10 pointer-events-none">
                    <span class="material-symbols-outlined text-[120px] text-primary">menu_book</span>
                </div>
                
                <div class="relative z-10 flex flex-col gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2.5 py-1 rounded-full bg-primary/20 text-primary text-xs font-bold uppercase tracking-wider">Upcoming Class</span>
                            <span class="text-xs font-medium text-on-surface-variant flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">schedule</span> 10:00 AM - 11:30 AM
                            </span>
                        </div>
                        <h3 class="text-3xl font-bold text-white mb-1">Database Management Systems</h3>
                        <p class="text-lg text-primary-fixed">CS302 • Section A</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-2">
                        <div class="flex items-center gap-3 bg-surface-container/50 p-4 rounded-2xl">
                            <div class="flex size-10 rounded-full bg-secondary-container/20 items-center justify-center text-secondary">
                                <span class="material-symbols-outlined">group</span>
                            </div>
                            <div>
                                <p class="text-xs text-on-surface-variant mb-0.5">Students</p>
                                <p class="text-sm font-semibold text-white">64 Enrolled</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-surface-container/50 p-4 rounded-2xl">
                            <div class="flex size-10 rounded-full bg-primary-container/20 items-center justify-center text-primary">
                                <span class="material-symbols-outlined">room</span>
                            </div>
                            <div>
                                <p class="text-xs text-on-surface-variant mb-0.5">Location</p>
                                <p class="text-sm font-semibold text-white">Room 402</p>
                            </div>
                        </div>
                    </div>

                    <button id="startSessionBtn" class="mt-4 group relative flex w-full h-16 items-center justify-center gap-3 overflow-hidden rounded-2xl bg-primary-container text-white shadow-lg shadow-primary/20 transition-all duration-300 hover:brightness-110 active:scale-[0.98]">
                        <span class="text-lg font-bold tracking-wide">Click to start a session</span>
                        <span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
                        <span id="startSpinner" class="hidden absolute right-6 size-6 border-[3px] border-white/40 border-t-white rounded-full animate-spin"></span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('startSessionBtn').addEventListener('click', async function() {
            var btn = this;
            var spinner = document.getElementById('startSpinner');
            var icon = btn.querySelector('.material-symbols-outlined');
            
            // Show loading state
            btn.classList.add('pointer-events-none', 'brightness-110');
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');

            try {
                const facultyEmail = localStorage.getItem("last_login_email") || "faculty@mrcet.ac.in";
                
                // Connect to the backend
                const response = await fetch('https://api.intelliattend.app/session/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        facultyId: facultyEmail,
                        subjectCode: 'CS302'
                    })
                });

                if (response.ok) {
                    // Successfully connected and started session
                    window.location.href = 'index.html';
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert("Backend Error: " + (errorData.message || "Could not start session."));
                    
                    // Reset button state on failure
                    btn.classList.remove('pointer-events-none', 'brightness-110');
                    icon.classList.remove('hidden');
                    spinner.classList.add('hidden');
                }
            } catch (error) {
                console.error("Connection failed:", error);
                
                // Note: If you want to bypass the API requirement during development if the server is offline,
                // you can comment out the alert and uncomment the window.location.href line.
                alert("Failed to connect to https://api.intelliattend.app. Please ensure the backend is running.");
                
                // window.location.href = 'index.html'; // Fallback bypass
                
                // Reset button state
                btn.classList.remove('pointer-events-none', 'brightness-110');
                icon.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
